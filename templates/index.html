<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo - DevOps CI/CD</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: #f9fafb;
        }
        .card {
            width: min(680px, 92%);
            padding: 48px;
            border: 1px solid #374151;
            border-radius: 18px;
            background: #1f2937;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 42px; }
        p { color: #d1d5db; line-height: 1.6; }
        .badge {
            display: inline-block;
            margin-top: 14px;
            padding: 8px 14px;
            border: 1px solid #4b5563;
            border-radius: 999px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>¡Hola Mundo DevOps! 👋</h1>
        <p>Aplicación web desplegada mediante un pipeline CI/CD con GitHub Actions, Docker Hub y Render.</p>
        <span class="badge">DevOps · CI/CD</span>
    </main>
</body>
</html>
